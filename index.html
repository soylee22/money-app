<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Purse</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D1014" media="(prefers-color-scheme:dark)">
<meta name="theme-color" content="#E2E2E0" media="(prefers-color-scheme:light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Purse">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>/* Money — instrument surface.
   Dark is the default. Light is authored separately, not inverted. */

:root{
  --ink:#0D1014; --stage:#E2E2E0; --bone:#D4D4CC; --mute:#A8A8A4;
  --graphite:#1A1A1A; --hairline-dk:#3A3D42; --hairline-lt:#9A9A95;
  --green:#10D070; --amber:#C99A2E; --clay:#C2564A;
  --fast:120ms; --slow:240ms; --ease:cubic-bezier(.2,0,.2,1);

  --surface:var(--ink);
  --raised:#12161B;
  --text:var(--bone);
  --dim:var(--mute);
  --hairline:var(--hairline-dk);
  --wash:rgba(212,212,204,.05);
  --wash-2:rgba(212,212,204,.10);
  --track:#22272E;
}

:root[data-theme="light"]{
  --surface:var(--stage);
  --raised:#EDEDEA;
  --text:var(--ink);
  --dim:#67675F;
  --hairline:var(--hairline-lt);
  --wash:rgba(13,16,20,.045);
  --wash-2:rgba(13,16,20,.09);
  --track:#C6C6BE;
  --green:#0B8F4E;
  --amber:#9A7218;
  --clay:#A63F35;
}

@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --surface:var(--stage);
    --raised:#EDEDEA;
    --text:var(--ink);
    --dim:#67675F;
    --hairline:var(--hairline-lt);
    --wash:rgba(13,16,20,.045);
    --wash-2:rgba(13,16,20,.09);
    --track:#C6C6BE;
    --green:#0B8F4E;
    --amber:#9A7218;
    --clay:#A63F35;
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
html{background:var(--surface)}
body{
  background:var(--surface);color:var(--text);
  font:400 15px/1.5 "Söhne","Inter",system-ui,-apple-system,sans-serif;
  font-feature-settings:"tnum" 1,"cv05" 1;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}

/* ─── shell ─────────────────────────────────────────────────────── */

#app{
  max-width:720px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 20px) 18px
          calc(env(safe-area-inset-bottom) + 84px);
  min-height:100%;
}
@media(min-width:760px){ #app{padding-left:40px;padding-right:40px} }

.view{display:none}
.view.on{display:block;animation:fade var(--slow) var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}

.topbar{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;padding-bottom:18px;
}
.topbar h1{
  margin:0;font-size:22px;font-weight:600;letter-spacing:-.02em;
}
.topbar .when{font-size:11.5px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.09em;white-space:nowrap}

/* ─── tab bar ───────────────────────────────────────────────────── */

nav#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--surface);
  border-top:1px solid var(--hairline);
  padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:saturate(140%) blur(12px);
}
nav#tabs button{
  background:none;border:0;cursor:pointer;
  min-height:52px;padding:9px 4px 10px;
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);
  transition:color var(--fast) var(--ease);
  position:relative;
}
nav#tabs button::before{
  content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%) scaleX(0);
  width:34px;height:1px;background:var(--text);
  transition:transform var(--fast) var(--ease);
}
nav#tabs button[aria-current="page"]{color:var(--text)}
nav#tabs button[aria-current="page"]::before{transform:translateX(-50%) scaleX(1)}
nav#tabs button:focus-visible{outline:2px solid var(--text);outline-offset:-4px}

/* ─── hero ──────────────────────────────────────────────────────── */

.hero{padding:6px 0 26px;border-bottom:1px solid var(--hairline)}
.hero .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.hero .val{
  font-size:clamp(52px,13vw,80px);font-weight:600;letter-spacing:-.03em;
  line-height:1;margin:12px 0 10px;
  font-variant-numeric:tabular-nums;
  transition:color var(--slow) var(--ease);
}
.hero .val.warn{color:var(--amber)}
.hero .val.bad{color:var(--clay)}
.hero .sub{font-size:13.5px;color:var(--dim);max-width:46ch}
.hero .cta{margin-top:20px;display:flex;gap:10px;flex-wrap:wrap}

.btn{
  font-size:13px;font-weight:500;letter-spacing:.01em;
  padding:11px 18px;min-height:44px;border-radius:999px;cursor:pointer;
  background:none;color:var(--text);border:1px solid var(--hairline);
  transition:border-color var(--fast) var(--ease),color var(--fast) var(--ease),
             background var(--fast) var(--ease);
}
.btn:hover{border-color:var(--text)}
.btn:active{background:var(--wash)}
.btn.primary{border-color:var(--amber);color:var(--amber)}
.btn.primary:hover{background:rgba(201,154,46,.10)}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:default;border-color:var(--hairline)}
.btn.sm{min-height:38px;padding:8px 14px;font-size:12px}

/* ─── sections & rows ───────────────────────────────────────────── */

.sec{padding-top:28px}
.sec > h2{
  margin:0 0 2px;font-size:10.5px;font-weight:400;
  text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
}
.sec > .note{font-size:12.5px;color:var(--dim);margin:6px 0 0;max-width:52ch}

.row{
  display:grid;grid-template-columns:1fr auto;gap:4px 16px;
  align-items:baseline;padding:13px 0;
  border-bottom:1px solid var(--hairline);
  transition:background var(--fast) var(--ease);
}
.row.tap{cursor:pointer;min-height:44px}
.row.tap:active{background:var(--wash)}
.row .nm{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .qty{font-size:15px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .meta{grid-column:1;font-size:12px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta2{grid-column:2;font-size:12px;color:var(--dim);text-align:right;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.row.neg .qty{color:var(--clay)}
.row.head{border-bottom:0;padding-bottom:4px}

.kv{display:grid;grid-template-columns:1fr auto;gap:16px;
  padding:11px 0;border-bottom:1px solid var(--hairline);font-size:14px}
.kv .k{color:var(--dim)}
.kv .v{font-variant-numeric:tabular-nums;text-align:right}
.kv .v.pos{color:var(--green)}
.kv .v.neg{color:var(--clay)}

/* ─── stat strip ────────────────────────────────────────────────── */

.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;
  border-bottom:1px solid var(--hairline)}
.stats > div{padding:16px 0}
.stats > div:nth-child(odd){padding-right:16px;border-right:1px solid var(--hairline)}
.stats > div:nth-child(even){padding-left:16px}
.stats > div:nth-child(n+3){border-top:1px solid var(--hairline)}
.stats .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.stats .fig{font-size:22px;font-weight:500;letter-spacing:-.02em;margin-top:6px;
  font-variant-numeric:tabular-nums}
.stats .fig.pos{color:var(--green)} .stats .fig.neg{color:var(--clay)}
.stats .fig.warn{color:var(--amber)}
.stats .sub{font-size:11.5px;color:var(--dim);margin-top:3px}

/* ─── budget bars ───────────────────────────────────────────────── */

.bud{padding:13px 0;border-bottom:1px solid var(--hairline);cursor:pointer}
.bud:active{background:var(--wash)}
.bud .line1{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline}
.bud .nm{font-size:15px}
.bud .amt{font-size:14px;font-variant-numeric:tabular-nums;color:var(--dim);
  display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.bud .amt b{font-weight:500;color:var(--text)}
.bud .bar{position:relative;height:3px;background:var(--track);margin:10px 0 6px;
  border-radius:2px;overflow:hidden}
.bud .fill{position:absolute;inset:0 auto 0 0;background:var(--text);
  transition:width var(--slow) var(--ease),background var(--slow) var(--ease)}
.bud .due{position:absolute;top:0;bottom:0;background:var(--dim);opacity:.45}
.bud.over .fill{background:var(--clay)}
.bud.risk .fill{background:var(--amber)}
.bud .tick{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--text);opacity:.55}
.bud .line2{display:grid;grid-template-columns:1fr auto;gap:12px;
  font-size:12px;color:var(--dim)}
.bud .line2 .r{text-align:right;font-variant-numeric:tabular-nums}
.bud .line2 .r.over{color:var(--clay)}

/* the assignable figure is the input */
.bud input.setb{
  width:88px;text-align:right;font-size:14px;font-weight:500;
  font-variant-numeric:tabular-nums;background:none;color:var(--text);
  border:1px solid transparent;border-radius:6px;padding:6px 8px;min-height:40px;
  transition:border-color var(--fast) var(--ease),background var(--fast) var(--ease);
}
.bud:hover input.setb{border-color:var(--hairline)}
.bud input.setb:focus{outline:none;border-color:var(--text);background:var(--wash);color:var(--text)}
@media(hover:none){ .bud input.setb{border-color:var(--hairline)} }
/* a figure you have not set is a suggestion, and must not look like a decision */
.bud input.setb{color:var(--dim);font-weight:400;border-style:dashed}
.bud input.setb.mine,.bud input.setb.settier{color:var(--text);font-weight:500;border-style:solid}

/* ─── month strip: time runs left to right ──────────────────────── */

.strip{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--hairline);margin-top:4px}
.strip::-webkit-scrollbar{display:none}
.strip button{
  background:none;border:0;cursor:pointer;flex:0 0 auto;
  min-height:44px;padding:12px 13px;
  font-size:12.5px;color:var(--dim);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color var(--fast) var(--ease),border-color var(--fast) var(--ease);
}
.strip button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--text)}
.strip button:focus-visible{outline:2px solid var(--text);outline-offset:-4px}

/* ─── charts ────────────────────────────────────────────────────── */

.chart{width:100%;display:block;margin:14px 0 2px;overflow:visible}
.chart .grid{stroke:var(--hairline);stroke-width:1}
.chart .band{fill:var(--text);opacity:.07}
.chart .norm{stroke:var(--dim);stroke-width:1;fill:none;stroke-dasharray:2 3}
.chart .act{stroke:var(--text);stroke-width:2;fill:none;
  stroke-linejoin:round;stroke-linecap:round}
.chart .act.warn{stroke:var(--amber)}
.chart .act.bad{stroke:var(--clay)}
.chart .proj{stroke:var(--text);stroke-width:1.5;fill:none;stroke-dasharray:3 3;opacity:.6}
.chart .area{fill:var(--text);opacity:.08}
.chart .mark{fill:var(--amber)}
.chart .axis{fill:var(--dim);font-size:10px;letter-spacing:.06em}
.chart .goalline{stroke:var(--amber);stroke-width:1;stroke-dasharray:2 4}

.hbar{display:inline-block;width:78px;height:3px;background:var(--track);
  border-radius:2px;vertical-align:middle;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--text);opacity:.55;border-radius:2px}

.sparkbars{display:flex;align-items:flex-end;gap:2px;height:26px}
.sparkbars i{flex:1;background:var(--text);opacity:.30;border-radius:1px;min-height:1px}
.sparkbars i.now{opacity:1}

/* ─── grid (category × month) ───────────────────────────────────── */

.gridwrap{overflow-x:auto;margin-top:10px;scrollbar-width:thin}
table.grid{border-collapse:collapse;font-size:12.5px;
  font-variant-numeric:tabular-nums;min-width:100%}
table.grid th,table.grid td{padding:8px 10px;text-align:right;white-space:nowrap}
table.grid th{font-weight:400;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--dim);border-bottom:1px solid var(--hairline)}
table.grid th.c1,table.grid td.c1{text-align:left;position:sticky;left:0;
  background:var(--surface);padding-left:0;z-index:2}
table.grid tr:last-child td{border-top:1px solid var(--hairline)}
table.grid td{cursor:pointer}
table.grid td.z{color:var(--dim);opacity:.4}

/* ─── inputs ────────────────────────────────────────────────────── */

.field{display:grid;gap:7px;padding:15px 0}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.field input,.field select{
  background:none;border:0;border-bottom:1px solid var(--hairline);
  padding:9px 0;min-height:44px;font-size:17px;border-radius:0;
  font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;
  transition:border-color var(--fast) var(--ease);
}
.field input:focus,.field select:focus{outline:none;border-bottom-color:var(--text)}
.field select{background-image:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 0}
.chip{
  background:none;border:1px solid var(--hairline);border-radius:999px;
  padding:9px 15px;min-height:40px;font-size:13px;cursor:pointer;
  font-variant-numeric:tabular-nums;
  transition:border-color var(--fast) var(--ease),color var(--fast) var(--ease);
}
.chip:hover{border-color:var(--text)}
.chip[aria-pressed="true"]{border-color:var(--text);background:var(--wash)}

.search{
  width:100%;background:none;border:0;border-bottom:1px solid var(--hairline);
  padding:11px 0;min-height:44px;font-size:16px;border-radius:0;
  transition:border-color var(--fast) var(--ease);
}
.search:focus{outline:none;border-bottom-color:var(--text)}
.search::placeholder{color:var(--dim)}

.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters select{
  flex:0 0 auto;background:none;border:1px solid var(--hairline);border-radius:999px;
  padding:8px 12px;min-height:40px;font-size:12.5px;-webkit-appearance:none;appearance:none;
}

/* ─── sheet ─────────────────────────────────────────────────────── */

#sheet{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(0,0,0,.5);
}
:root[data-theme="light"] #sheet{background:rgba(13,16,20,.30)}
#sheet.on{display:block}
#sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-height:86vh;overflow-y:auto;
  background:var(--surface);border-top:1px solid var(--hairline);
  border-radius:24px 24px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 26px);
  max-width:720px;margin:0 auto;
  animation:rise var(--slow) var(--ease);
  -webkit-overflow-scrolling:touch;
}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#sheet .grab{width:34px;height:4px;border-radius:2px;background:var(--hairline);
  margin:6px auto 14px}
#sheet h3{margin:0 0 2px;font-size:19px;font-weight:600;letter-spacing:-.02em}
#sheet .sh-sub{font-size:12.5px;color:var(--dim);margin-bottom:8px}

/* ─── gate ──────────────────────────────────────────────────────── */

#gate{
  position:fixed;inset:0;z-index:80;background:var(--surface);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
#gate .box{width:100%;max-width:320px}
#gate .mark{display:flex;align-items:flex-end;gap:3px;height:30px;margin-bottom:26px}
#gate .mark i{width:7px;background:var(--text);opacity:.35;border-radius:1px}
#gate .mark i:last-child{background:var(--amber);opacity:1}
#gate h2{margin:0 0 4px;font-size:19px;font-weight:600;letter-spacing:-.02em}
#gate p{margin:0 0 22px;font-size:13px;color:var(--dim)}
#gate input{width:100%;background:none;border:0;border-bottom:1px solid var(--hairline);
  padding:11px 0;min-height:48px;font-size:17px;border-radius:0}
#gate input:focus{outline:none;border-bottom-color:var(--text)}
#gate .err{color:var(--clay);font-size:12.5px;min-height:18px;margin-top:10px}
#gate label.rem{display:flex;align-items:center;gap:9px;font-size:12.5px;
  color:var(--dim);margin-top:16px;min-height:44px;cursor:pointer}
#gate .go{margin-top:6px;width:100%}

.muted{color:var(--dim)}
.tiny{font-size:11.5px}
.tnum{font-variant-numeric:tabular-nums}
.pos{color:var(--green)} .neg{color:var(--clay)} .warn{color:var(--amber)}
.empty{padding:26px 0;color:var(--dim);font-size:13.5px}
.spacer{height:8px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div id="gate" hidden>
  <div class="box">
    <div class="mark"><i style="height:11px"></i><i style="height:17px"></i><i style="height:23px"></i><i style="height:30px"></i></div>
    <h2>Purse</h2>
    <p>Locked. Nothing here is readable without the passphrase, including to whoever finds the link.</p>
    <input id="g-pass" type="password" inputmode="text" autocomplete="current-password"
           placeholder="Passphrase" aria-label="Passphrase" enterkeyhint="go">
    <div class="err" id="g-err"></div>
    <label class="rem"><input type="checkbox" id="g-remember" checked> Remember on this device</label>
    <button class="btn primary go" id="g-go">Unlock</button>
  </div>
</div>

<div id="shell" hidden>
  <div id="app"><div id="views"></div></div>
  <nav id="tabs">
    <button data-tab="month" aria-current="page">Month</button>
    <button data-tab="spend" aria-current="false">Spend</button>
    <button data-tab="saved" aria-current="false">Saved</button>
    <button data-tab="more"  aria-current="false">More</button>
  </nav>

<script>/* Money — app logic.
   The vault is decrypted in the browser; nothing leaves the device. */
(() => {
'use strict';

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const LS = 'money.v1.';

/* ── formatting ──────────────────────────────────────────────────── */

const gbp = (n, dp = 0) => (n < 0 ? '-' : '') + '£' +
  Math.abs(n).toLocaleString('en-GB', {minimumFractionDigits: dp, maximumFractionDigits: dp});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const mlabel = m => MON[+m.slice(5, 7) - 1] + ' ' + m.slice(2, 4);
const mlong  = m => ['January','February','March','April','May','June','July','August',
                     'September','October','November','December'][+m.slice(5,7)-1] + ' ' + m.slice(0,4);
const dlabel = d => (+d.slice(8, 10)) + ' ' + MON[+d.slice(5, 7) - 1];
const addMonths = (m, k) => {
  let y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1 + k;
  y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12;
  return y + '-' + String(mo + 1).padStart(2, '0');
};
const plural = (n, one, many) => n === 1 ? `1 ${one}` : `${n} ${many || one + 's'}`;

/* ── state ───────────────────────────────────────────────────────── */

let P, M, R, CG = {}, L;
const DEF_LOCAL = {cats: {}, budgets: {}, plans: [], save_rate: null,
                   growth: 5, horizon: 10, goals: [], theme: null};

const loadLocal = () => {
  try { L = Object.assign({}, DEF_LOCAL, JSON.parse(localStorage.getItem(LS + 'local') || '{}')); }
  catch { L = Object.assign({}, DEF_LOCAL); }
};
const saveLocal = () => { localStorage.setItem(LS + 'local', JSON.stringify(L)); queueSync(); };
const mkey = m => String(m || '').toLowerCase().trim();
const catOf = r => L.cats[mkey(r.m)] || r.c;
const groupOf = c => CG[c] || 'fun';

/* ── write-back ──────────────────────────────────────────────────────
   Categories and budgets set here are pushed to a small private repo that
   app.py reads at the next build, so a merchant filed on the phone is filed
   everywhere. The phone is the only writer, so there is nothing to merge.
   Everything is queued and retried: an edit made underground still lands. */

let sync = {state: 'off', at: null, err: null, sha: null, pending: false};
let syncTimer;

const b64utf8 = s => {
  const bytes = new TextEncoder().encode(s);
  let out = '';
  for (const b of bytes) out += String.fromCharCode(b);
  return btoa(out);
};

function queueSync() {
  if (!P.sync) return;
  sync.pending = true;
  localStorage.setItem(LS + 'dirty', '1');   // survives the app being closed mid-edit
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushSync, 2500);
}

async function pushSync(manual) {
  if (!P.sync || (!sync.pending && !manual)) return;
  if (!navigator.onLine) { sync.state = 'waiting'; sync.err = 'no signal'; return paint(); }
  sync.state = 'saving'; sync.err = null; paint();

  const url = `https://api.github.com/repos/${P.sync.repo}/contents/${P.sync.path}`;
  const head = {Authorization: `Bearer ${P.sync.token}`, Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'};
  const body = JSON.stringify({cats: L.cats, budgets: L.budgets,
                               plans: L.plans, save_rate: L.save_rate,
                               growth: L.growth, goals: L.goals}, null, 1);
  try {
    if (!sync.sha) {
      const r = await fetch(url + '?ref=main&t=' + Date.now(), {headers: head, cache: 'no-store'});
      if (r.ok) sync.sha = (await r.json()).sha;
      else if (r.status !== 404) throw new Error('HTTP ' + r.status);
    }
    let put = await fetch(url, {method: 'PUT', headers: head, body: JSON.stringify(
      {message: 'purse: edits from the phone', content: b64utf8(body), sha: sync.sha || undefined})});
    if (put.status === 409 || put.status === 422) {          // someone moved the file underneath us
      sync.sha = null;
      const r = await fetch(url + '?ref=main&t=' + Date.now(), {headers: head, cache: 'no-store'});
      if (r.ok) sync.sha = (await r.json()).sha;
      put = await fetch(url, {method: 'PUT', headers: head, body: JSON.stringify(
        {message: 'purse: edits from the phone', content: b64utf8(body), sha: sync.sha || undefined})});
    }
    if (!put.ok) throw new Error('HTTP ' + put.status);
    sync.sha = (await put.json()).content.sha;
    sync.state = 'saved'; sync.at = new Date().toISOString(); sync.pending = false;
    localStorage.setItem(LS + 'syncedAt', sync.at);
    localStorage.removeItem(LS + 'dirty');
  } catch (e) {
    sync.state = 'error'; sync.err = String(e.message || e);
  }
  paint();
}

// only redraw the sync line, so a push never interrupts what is on screen
function paint() {
  const n = document.getElementById('syncline');
  if (n) n.innerHTML = syncText();
}

function syncText() {
  if (!P.sync) return 'off · edits stay on this phone';
  const when = sync.at || localStorage.getItem(LS + 'syncedAt');
  const ago = when ? timeAgo(when) : 'never';
  return {
    saving:  'saving…',
    saved:   `saved · ${ago}`,
    waiting: `waiting for signal · last saved ${ago}`,
    error:   `<span class="neg">failed (${esc(sync.err || '')})</span> · last saved ${ago}`,
    off:     sync.pending ? 'unsaved changes' : `saved · ${ago}`,
  }[sync.state];
}

function timeAgo(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 90) return 'just now';
  if (s < 5400) return plural(Math.round(s / 60), 'minute') + ' ago';
  if (s < 172800) return plural(Math.round(s / 3600), 'hour') + ' ago';
  return plural(Math.round(s / 86400), 'day') + ' ago';
}

addEventListener('online', () => { if (sync.pending) pushSync(); });

/* ── derivation (matches the Python engine: spend + refund, one-offs out) ── */

let _cache = null;
const bust = () => { _cache = null; };

function derived() {
  if (_cache) return _cache;
  const byMonth = {}, oneOff = {}, merchByCat = {};
  for (const r of R) {
    if (r.k !== 'spend' && r.k !== 'refund') continue;
    const mo = r.d.slice(0, 7), c = catOf(r);
    if (r.o) { oneOff[mo] = (oneOff[mo] || 0) - r.a; continue; }
    (byMonth[mo] ||= {})[c] = (byMonth[mo][c] || 0) - r.a;
    (merchByCat[c] ||= {})[r.m] = (merchByCat[c][r.m] || 0) - r.a;
  }
  const months = Object.keys(byMonth).sort();
  const complete = months.filter(m => !M.grid.partial[m] && m !== M.month.month);
  const recent = complete.slice(-6);
  const typical = {};
  const cats = new Set();
  months.forEach(m => Object.keys(byMonth[m]).forEach(c => cats.add(c)));
  for (const c of cats) {
    const vals = recent.map(m => byMonth[m][c] || 0).sort((a, b) => a - b);
    typical[c] = vals.length ? (vals.length % 2
      ? vals[(vals.length - 1) / 2]
      : (vals[vals.length / 2 - 1] + vals[vals.length / 2]) / 2) : 0;
  }
  _cache = {byMonth, oneOff, months, complete, recent, typical,
            cats: [...cats].sort(), merchByCat};
  return _cache;
}

/* Where a part-month lands. Same rule as metrics.py: cost the remaining days at
   a blend of your own run rate and a normal month, weighted by how much of the
   month has actually been seen. Multiplying up by day-of-month is only honest
   on the last one. */
function project(spent, normal, elapsed, total) {
  if (!total || !elapsed || elapsed >= total) return spent;
  const w = elapsed / total;
  const run = spent / elapsed;
  const norm = normal ? normal / total : run;
  return spent + (w * run + (1 - w) * norm) * (total - elapsed);
}

/* budget for a category in a month: your setting, else the six-month typical */
function budgetFor(month, cat) {
  const set = L.budgets[month] && L.budgets[month][cat];
  if (set != null && set !== '') return {v: +set, set: true};
  return {v: Math.round(derived().typical[cat] || 0), set: false};
}

/* what is still expected to land this month and has not yet */
function toCome(month) {
  const pm = M.per_month[month];
  return pm ? (pm.to_come_list || []) : [];
}

/* ── charts ──────────────────────────────────────────────────────── */

function sparkbars(vals, hotIdx) {
  const hi = Math.max(...vals, 1);
  return `<div class="sparkbars">${vals.map((v, i) =>
    `<i class="${i === hotIdx ? 'now' : ''}" style="height:${Math.max(2, (v / hi) * 26).toFixed(1)}px"></i>`
  ).join('')}</div>`;
}

/* ── sheet ───────────────────────────────────────────────────────── */

function sheet(title, sub, body) {
  $('#sheet .panel').innerHTML =
    `<div class="grab"></div><h3>${title}</h3>${sub ? `<div class="sh-sub">${sub}</div>` : ''}${body}`;
  $('#sheet').classList.add('on');
  $('#sheet .panel').scrollTop = 0;
}
const closeSheet = () => $('#sheet').classList.remove('on');

function txSheet(title, sub, rows, empty) {
  if (!rows.length) return sheet(title, sub,
    `<div class="empty">${empty || 'Nothing paid yet.'}</div>`);
  const body = rows.slice(0, 300).map(r => `
    <div class="row">
      <div class="nm">${esc(r.m)}</div>
      <div class="qty">${gbp(-r.a, 2)}</div>
      <div class="meta">${dlabel(r.d)} · ${esc(catOf(r))}${r.o ? ' · one-off' : ''}</div>
      <div class="meta2">${esc(r.ac)}</div>
    </div>`).join('');
  const total = rows.reduce((s, r) => s - r.a, 0);
  sheet(title, `${sub} · ${plural(rows.length, 'payment')} · ${gbp(total, 2)}`, body +
    (rows.length > 300 ? `<div class="empty">Showing the first 300.</div>` : ''));
}

/* ── views ───────────────────────────────────────────────────────── */

const V = {};
let tab = 'month';
let spendMonth = null, gridOpen = false, spendTier = '';

/* The spine: income, then what is fixed, then what is nearly fixed, then what
   is not, and whatever survives is saving. Three tiers, which are the groups
   the engine has always used, finally shown as the structure they are. */
const TIERS = [
  ['committed', 'Fixed',      'rent, bills, debt. Dates and amounts you do not choose'],
  ['essential', 'Semi-known', 'groceries, commute, health. Predictable, not fixed'],
  ['fun',       'Flex',       'the dial. Everything you actually decide each month'],
];

function tiers(month) {
  const d = derived();
  const spent = d.byMonth[month] || {};
  const current = month === M.month.month;
  const tcByCat = {};
  toCome(month).forEach(t => { if (t.amount) tcByCat[t.category] = (tcByCat[t.category] || 0) + t.amount; });

  const cats = [...new Set([...d.cats, ...Object.keys(L.budgets[month] || {}),
                            ...Object.keys(tcByCat)])];
  const out = {};
  for (const [key] of TIERS) out[key] = {budget: 0, spent: 0, due: 0, rows: []};
  for (const c of cats) {
    const b = budgetFor(month, c), s = spent[c] || 0, due = current ? (tcByCat[c] || 0) : 0;
    if (!b.v && !s && !due) continue;
    const t = out[groupOf(c)] || out.fun;
    t.budget += b.v; t.spent += s; t.due += due;
    t.rows.push({c, b, s, due});
  }
  for (const k in out) out[k].rows.sort(
    (a, b) => Math.max(b.s + b.due, b.b.v) - Math.max(a.s + a.due, a.b.v));
  return out;
}

/* Income for a month is the salary that landed at the end of the month before,
   which is why August is fully funded on the 1st. */
const incomeFor = mo => mo === M.budgets.ahead_month
  ? M.budgets.expected_income : (M.per_month[mo] || {}).income || 0;

function waterfall(month) {
  const t = tiers(month);
  const income = incomeFor(month);
  const pocket = M.budgets.pocket;
  const budgeted = TIERS.reduce((s, [k]) => s + t[k].budget, 0) + pocket;
  const paid = TIERS.reduce((s, [k]) => s + t[k].spent, 0);
  return {t, income, pocket, budgeted, paid, leaves: income - budgeted};
}

/* ── month ───────────────────────────────────────────────────────── */

V.month = () => {
  const mo = M.month, m = mo.month;
  const w = waterfall(m);
  const target = M.budgets.save_target;
  const gap = w.leaves - target;
  const actual = mo.projected_saving;

  return `
  <div class="topbar"><h1>Purse</h1>
    <div class="when">${mlong(m)} · day ${mo.days_elapsed}/${mo.days_total}</div></div>

  <section class="hero">
    <div class="lbl">Your budgets leave you saving</div>
    <div class="val ${w.leaves < 0 ? 'bad' : gap < 0 ? 'warn' : ''}">${gbp(w.leaves)}</div>
    <div class="sub">If you spend every budget below.
      ${gap >= 0 ? `${gbp(gap)} clear of` : `${gbp(-gap)} short of`} the ${gbp(target)} target.
      ${actual - w.leaves > 100
        ? `You never actually spend it all: on your real pace you are heading for ${gbp(actual)}.`
        : actual - w.leaves < -100
          ? `On your real pace it is worse than that, ${gbp(actual)}.` : ''}
      Flex is ${gbp(w.t.fun.budget)} of it, and the only part you decide.</div>
  </section>

  ${stale()}

  <section class="sec">
    <h2>Where it goes</h2>
    <div class="kv"><div class="k">Coming in</div><div class="v">${gbp(w.income)}</div></div>
    ${TIERS.map(([k, label, why]) => {
      const t = w.t[k];
      const over = t.spent + t.due > t.budget && t.budget > 0;
      const pctv = t.budget > 0 ? Math.min(100, (t.spent / t.budget) * 100) : 0;
      const duePct = t.budget > 0 ? Math.min(100 - pctv, (t.due / t.budget) * 100) : 0;
      return `
      <div class="bud ${over ? 'over' : ''}" data-tier="${k}">
        <div class="line1">
          <span class="nm">${label}</span>
          <span class="amt"><b>${gbp(t.spent)}</b> of <input class="setb settier"
            inputmode="decimal" value="${gbp(t.budget)}" data-raw="${Math.round(t.budget)}"
            data-tier="${k}" aria-label="${label} budget"></span>
        </div>
        <div class="bar">
          <div class="fill" style="width:${pctv.toFixed(1)}%"></div>
          ${duePct > 0 ? `<div class="due" style="left:${pctv.toFixed(1)}%;width:${duePct.toFixed(1)}%"></div>` : ''}
          <div class="tick" style="left:${M.budgets.current.elapsed_pct.toFixed(1)}%"></div>
        </div>
        <div class="line2">
          <span>${why}</span>
          <span class="r">${plural(t.rows.length, 'category', 'categories')}</span>
        </div>
      </div>`;
    }).join('')}
    <div class="kv"><div class="k">Pocket money</div><div class="v">${gbp(w.pocket)}</div></div>
    <div class="kv"><div class="k"><b>Leaves to save</b></div>
      <div class="v ${gap < 0 ? 'neg' : 'pos'}"><b>${gbp(w.leaves)}</b></div></div>
    <p class="note">Change a tier figure and everything under it moves with it, keeping
      the same shape. Tap a tier to open its categories.</p>
  </section>

  ${billsCalendar(m)}

  <section class="sec">
    <h2>Running ahead or behind</h2>
    ${(() => {
      const frac = mo.days_total ? mo.days_elapsed / mo.days_total : 1;
      const byNow = frac < 0.97 ? ` by day ${mo.days_elapsed}` : '';
      const rows = M.categories
        .map(c => { const pace = c.normal * frac; return {...c, pace, gap: c.this_month - pace}; })
        .filter(c => c.this_month > 0 || c.gap > 5)
        .sort((a, b) => b.gap - a.gap).slice(0, 5);
      return rows.map(c => `
        <div class="row tap" data-cat="${esc(c.name)}" data-month="${m}">
          <div class="nm">${esc(c.name)}</div>
          <div class="qty">${gbp(c.this_month)}</div>
          <div class="meta">${c.gap >= 0 ? '+' : ''}${gbp(c.gap)} against ${gbp(c.pace)}${byNow || ' in a normal month'}</div>
          <div class="meta2">${sparkbars(c.series.slice(-8), c.series.length - 1)}</div>
        </div>`).join('') || `<div class="empty">Nothing spent yet this month.</div>`;
    })()}
  </section>

  <section class="sec">
    <h2>Exports</h2>
    ${M.coverage.map(c => `<div class="kv"><div class="k">${esc(c.account)}</div>
      <div class="v ${c.days_behind > 10 ? 'neg' : ''}">${c.days_behind === 0 ? 'up to date'
        : plural(c.days_behind, 'day') + ' behind'}</div></div>`).join('')}
  </section>`;
};

/* A budget you have not set is the median of six months, which is the right
   default until something ends. The mortgage, the old rent and two council
   taxes all stopped in May, so those medians now describe a life nobody lives.
   Say so, with the number, rather than quietly inflating the budget. */
function stale() {
  const d = derived(), m = M.month.month;
  const recent = d.complete.slice(-2);
  const due = {};
  toCome(m).forEach(t => { due[t.category] = true; });
  const bad = d.cats.map(c => {
    const b = budgetFor(m, c);
    if (b.set || !b.v || due[c]) return null;
    const now = recent.reduce((s, x) => s + ((d.byMonth[x] || {})[c] || 0), 0) / (recent.length || 1);
    return (b.v > now * 2 + 50 && b.v - now > 100) ? {c, was: b.v, now} : null;
  }).filter(Boolean).sort((a, b) => (b.was - b.now) - (a.was - a.now));
  if (!bad.length) return '';
  const total = bad.reduce((s, x) => s + x.was - x.now, 0);
  return `
  <section class="sec">
    <h2>Budgets describing a life you have left</h2>
    <p class="note">${gbp(total)} of the budget above is a six-month median that
      has not caught up with the move. Set ${bad.length === 1 ? 'it' : 'them'} and
      the saving figure becomes real.</p>
    ${bad.slice(0, 4).map(x => `
      <div class="row tap" data-cat="${esc(x.c)}" data-month="${m}">
        <div class="nm">${esc(x.c)}</div>
        <div class="qty">${gbp(x.was)}</div>
        <div class="meta">budgeted at the old median, but the last two months
          averaged ${gbp(x.now)}</div>
      </div>`).join('')}
  </section>`;
}

/* ── the bills calendar ──────────────────────────────────────────── */

function billDays() {
  // when each live commitment normally lands, from its own history
  const days = {};
  for (const c of M.commitments.live) {
    const ds = R.filter(r => r.m === c.name && r.k === 'spend')
      .map(r => +r.d.slice(8, 10)).sort((a, b) => a - b);
    if (ds.length) days[c.name] = {day: ds[Math.floor(ds.length / 2)], amount: c.amount};
  }
  return days;
}

function billsCalendar(month) {
  const days = billDays();
  const paid = {};
  R.forEach(r => { if (r.d.slice(0, 7) === month && r.k === 'spend') paid[r.m] = (paid[r.m] || 0) - r.a; });
  const today = month === M.month.month ? M.month.days_elapsed : 99;

  const items = Object.entries(days).map(([name, d]) => ({
    name, day: d.day, amount: paid[name] || d.amount, done: paid[name] != null,
  })).sort((a, b) => a.day - b.day);

  // declared bills with no history yet (rent) sit at the end, dateless
  const undated = toCome(month).filter(t => !days[t.name]);
  if (!items.length && !undated.length) return '';

  const left = items.filter(i => !i.done).reduce((s, i) => s + i.amount, 0)
    + undated.reduce((s, t) => s + (t.amount || 0), 0);

  return `
  <section class="sec">
    <h2>Coming out this month</h2>
    <p class="note">${gbp(left)} of it still to leave the account.</p>
    ${items.map(i => `
      <div class="row tap" data-teach="${esc(i.name)}">
        <div class="nm">${esc(i.name)}</div>
        <div class="qty ${i.done ? 'muted' : ''}">${gbp(i.amount)}</div>
        <div class="meta">${ordinal(i.day)}${i.done ? ' · paid'
          : i.day < today ? ' · not seen yet' : ''}</div>
      </div>`).join('')}
    ${undated.map(t => `
      <div class="row">
        <div class="nm">${esc(t.name)}</div>
        <div class="qty">${t.amount ? gbp(t.amount) : 'not costed'}</div>
        <div class="meta">no date yet${t.note ? ' · ' + esc(t.note) : ''}</div>
      </div>`).join('')}
  </section>`;
}

const ordinal = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');

/* ── spend ───────────────────────────────────────────────────────── */

V.spend = () => {
  const d = derived();
  const strip = [...d.months, M.budgets.ahead_month];
  spendMonth ||= M.month.month;
  const m = spendMonth;
  const ahead = m === M.budgets.ahead_month;
  const current = m === M.month.month;
  const prev = addMonths(m, -1);
  const w = waterfall(m);

  const body = TIERS.filter(([k]) => !spendTier || spendTier === k).map(([k, label]) => {
    const t = w.t[k];
    if (!t.rows.length) return '';
    return `<section class="sec">
      <h2>${label} · ${gbp(t.spent)} of ${gbp(t.budget)}</h2>
      ${t.rows.map(({c, b, s, due}) => {
        const left = b.v - s - due;
        const projected = current ? project(s, b.v, M.month.days_elapsed, M.month.days_total) + due : s + due;
        const over = left < 0;
        const risk = !over && projected > b.v && b.v > 0;
        const state = b.set ? (over ? 'over' : risk ? 'risk' : '') : '';
        const wS = b.v > 0 ? Math.min(100, (s / b.v) * 100) : (s > 0 ? 100 : 0);
        const wD = b.v > 0 ? Math.min(100 - wS, (due / b.v) * 100) : 0;
        const last = (d.byMonth[prev] || {})[c] || 0;
        return `
        <div class="bud ${state}" data-cat="${esc(c)}" data-month="${m}">
          <div class="line1">
            <span class="nm">${esc(c)}</span>
            <span class="amt"><b>${gbp(s)}</b> of <input class="setb ${b.set ? 'mine' : ''}"
              inputmode="decimal" value="${gbp(b.v)}" data-raw="${b.v}" data-setcat="${esc(c)}"
              aria-label="budget for ${esc(c)}"></span>
          </div>
          <div class="bar">
            <div class="fill" style="width:${wS.toFixed(1)}%"></div>
            ${wD > 0 ? `<div class="due" style="left:${wS.toFixed(1)}%;width:${wD.toFixed(1)}%"></div>` : ''}
            ${current ? `<div class="tick" style="left:${M.budgets.current.elapsed_pct.toFixed(1)}%"></div>` : ''}
          </div>
          <div class="line2">
            <span>${b.set ? 'your budget' : 'typical'} · last month ${gbp(last)} · usual ${gbp(d.typical[c] || 0)}</span>
            <span class="r ${over ? 'over' : ''}">${over
              ? gbp(-left) + (b.set ? ' over' : ' above typical') : gbp(left) + ' left'}</span>
          </div>
        </div>`;
      }).join('')}
    </section>`;
  }).join('');

  return `
  <div class="topbar"><h1>Spend</h1>
    <div class="when">${ahead ? 'planning' : current ? 'in flight' : 'closed'}</div></div>

  <div class="strip" id="mstrip">${strip.map(x => `
    <button data-month="${x}" aria-selected="${x === m}">${x === M.budgets.ahead_month
      ? mlabel(x) + ' →' : mlabel(x)}</button>`).join('')}</div>

  <section class="hero" style="border-bottom:0;padding-bottom:10px">
    <div class="lbl">${ahead ? 'Planned' : current ? 'Spent so far' : 'Spent'}</div>
    <div class="val" style="font-size:clamp(38px,10vw,58px)">${gbp(ahead ? w.budgeted - w.pocket : w.paid)}</div>
    <div class="sub">${gbp(w.income)} came in.
      ${gbp(w.budgeted)} budgeted including ${gbp(w.pocket)} pocket money,
      which leaves ${gbp(w.leaves)} to save against a ${gbp(M.budgets.save_target)} target.</div>
    ${ahead ? `<div class="cta"><button class="btn primary" id="copyprev">Copy ${mlabel(prev)} amounts</button></div>` : ''}
  </section>

  <div class="chips" style="padding:12px 0 0">
    <button class="chip" data-tierfilter="" aria-pressed="${!spendTier}">All</button>
    ${TIERS.map(([k, label]) => `<button class="chip" data-tierfilter="${k}"
      aria-pressed="${spendTier === k}">${label}</button>`).join('')}
  </div>

  ${body}

  <section class="sec">
    <h2>Every category, every month</h2>
    <p class="note">Tap a figure to see the payments behind it. Time runs left to right.</p>
    ${gridOpen ? gridTable() : `<div class="cta"><button class="btn sm" id="showgrid">Show the grid</button></div>`}
  </section>

  ${(derived().oneOff[m] || 0) ? `<section class="sec"><h2>Held out of the comparison</h2>
    <div class="row tap" data-oneoff="${m}"><div class="nm">One-offs</div>
      <div class="qty">${gbp(derived().oneOff[m])}</div>
      <div class="meta">Large and unfamiliar. Not in any budget above.</div></div></section>` : ''}`;
};

function gridTable() {
  const d = derived();
  const cols = d.months.slice(-13);
  const cats = d.cats.slice().sort((a, b) => {
    const sa = cols.reduce((s, m) => s + (d.byMonth[m][a] || 0), 0);
    const sb = cols.reduce((s, m) => s + (d.byMonth[m][b] || 0), 0);
    return sb - sa;
  });
  const rows = cats.map(c => {
    const vals = cols.map(m => d.byMonth[m][c] || 0);
    const hi = Math.max(...vals, 1);
    return `<tr><td class="c1">${esc(c)}</td>${vals.map((v, i) => `
      <td class="${v ? '' : 'z'}" style="${v ? `background:rgba(128,128,128,${(0.05 + 0.30 * v / hi).toFixed(3)})` : ''}"
        data-cat="${esc(c)}" data-month="${cols[i]}">${v ? gbp(v) : '·'}</td>`).join('')}</tr>`;
  }).join('');
  const totals = cols.map(m => Object.values(d.byMonth[m]).reduce((s, v) => s + v, 0));
  return `<div class="gridwrap" id="gridwrap"><table class="grid">
    <thead><tr><th class="c1">Category</th>${cols.map(m => `<th>${mlabel(m)}</th>`).join('')}</tr></thead>
    <tbody>${rows}<tr><td class="c1">Total</td>${totals.map(v => `<td>${gbp(v)}</td>`).join('')}</tr></tbody>
  </table></div>`;
}

/* ── saved ───────────────────────────────────────────────────────── */

V.saved = () => {
  const g = M.goal, mo = M.month;
  const d = derived();
  // the month in flight is the hero, and a part-month saving figure is a lie
  const months = d.months.filter(x => !M.grid.partial[x] && x !== mo.month);
  const hist = months.map(x => ({m: x, v: M.per_month[x].saved}));
  const hi = Math.max(...hist.map(h => Math.abs(h.v)), 1);

  // where the money actually went: invest and debt-principal rows carry the destination
  const dest = {};
  const since = months.slice(-6)[0] || months[0];
  for (const r of R) {
    if (r.d.slice(0, 7) < since) continue;
    if (r.k === 'invest' || r.k === 'debt') dest[r.c] = (dest[r.c] || 0) - r.a;
  }
  const pots = M.goal.pots.filter(p => p.known && p.net_flow).map(p => [p.name, p.net_flow]);

  const rate = mo.projected_saving;
  const months_to = rate > 0 ? Math.ceil((g.target - g.now) / rate) : null;

  return `
  <div class="topbar"><h1>Saved</h1><div class="when">${mlong(mo.month)}</div></div>

  <section class="hero">
    <div class="lbl">On course this month</div>
    <div class="val ${rate < M.budgets.save_target ? 'warn' : ''}">${gbp(rate)}</div>
    <div class="sub">Against a ${gbp(M.budgets.save_target)} target.
      What is left after everything that has gone out and everything still to come.
      Money moved into a pot is not saving; money not spent is.</div>
  </section>

  <section class="sec">
    <h2>What you actually saved</h2>
    ${hist.slice().reverse().slice(0, 12).map(h => `
      <div class="row tap" data-savedmonth="${h.m}">
        <div class="nm">${mlong(h.m)}</div>
        <div class="qty ${h.v < 0 ? 'neg' : ''}">${gbp(h.v)}</div>
        <div class="meta">${gbp(M.per_month[h.m].income)} in · ${gbp(M.per_month[h.m].spend)} out</div>
        <div class="meta2"><span class="hbar"><i style="width:${
          Math.max(2, Math.abs(h.v) / hi * 100).toFixed(1)}%"></i></span></div>
      </div>`).join('')}
  </section>

  <section class="sec">
    <h2>Where it went, last six months</h2>
    ${Object.entries(dest).sort((a, b) => b[1] - a[1]).map(([k, v]) => `
      <div class="kv"><div class="k">${esc(k)}</div><div class="v">${gbp(v)}</div></div>`).join('')
      || `<div class="empty">Nothing moved into an investment or off a debt.</div>`}
    ${pots.length ? `<p class="note">Pots moved as well, and none of it is saving in itself:
      ${pots.map(([n, v]) => `${esc(n)} ${gbp(v)}`).join(', ')}.</p>` : ''}
  </section>

  <section class="sec">
    <h2>${esc(g.name)}</h2>
    <div class="kv"><div class="k">Saved so far</div><div class="v">${gbp(g.now)} of ${gbp(g.target)} · ${g.pct}%</div></div>
    <div class="kv"><div class="k">Needed each month for ${mlong(g.deadline.slice(0, 7))}</div>
      <div class="v neg">${gbp(g.required_monthly)}</div></div>
    <div class="kv"><div class="k">At ${gbp(rate)} a month you get there</div>
      <div class="v">${months_to ? mlong(addMonths(mo.month, months_to)) : 'never'}</div></div>
    <div class="kv"><div class="k">Net worth</div><div class="v">${gbp(g.net_worth)}</div></div>
    ${g.unknown.length ? `<p class="note">Understated: ${esc(g.unknown.join(', '))}
      ${g.unknown.length === 1 ? 'has' : 'have'} no balance in config.yaml.</p>` : ''}
  </section>`;
};

/* ── more ────────────────────────────────────────────────────────── */

let txQ = {q: '', month: '', cat: '', kind: 'spend'}, txLimit = 60;

V.more = () => {
  const d = derived();
  // one row per merchant, not per payment, or the same council tax fills the screen
  const agg = {};
  for (const r of R) {
    if (r.k !== 'spend' || catOf(r) !== 'Other') continue;
    const a = (agg[r.m] ||= {m: r.m, n: 0, t: 0, last: r.d});
    a.n++; a.t -= r.a; if (r.d > a.last) a.last = r.d;
  }
  const teach = Object.values(agg).sort((a, b) => b.t - a.t);
  const learned = Object.keys(L.cats).length;

  const rows = filterTx();
  return `
  <div class="topbar"><h1>More</h1><div class="when">${P.rowcount.toLocaleString('en-GB')} payments</div></div>

  <section class="sec" style="padding-top:8px">
    <h2>Teach it</h2>
    <p class="note">${teach.length ? `${plural(teach.length, 'name')} sitting in Other, costliest first.
      File one and every payment to that name moves with it, back through the whole history.`
      : 'Nothing is sitting in Other. It knows where everything goes.'}
      ${learned ? ` You have taught it ${plural(learned, 'name')}${P.sync
        ? ', and the laptop has them too' : ''}.` : ''}</p>
    ${teach.slice(0, 12).map(r => `
      <div class="row tap" data-teach="${esc(r.m)}">
        <div class="nm">${esc(r.m)}</div>
        <div class="qty">${gbp(r.t)}</div>
        <div class="meta">${plural(r.n, 'payment')} · last ${dlabel(r.last)} · tap to file it</div>
      </div>`).join('')}
    ${learned ? `<div class="cta">${P.sync ? '' :
      `<button class="btn sm" id="export">Copy your edits as YAML</button>`}
      <button class="btn sm" id="forget">Forget them</button></div>` : ''}
  </section>

  <section class="sec">
    <h2>Every payment</h2>
    <input class="search" id="txq" placeholder="Search merchant" value="${esc(txQ.q)}" autocomplete="off">
    <div class="filters">
      <select id="txmonth"><option value="">All months</option>
        ${d.months.slice().reverse().map(m => `<option value="${m}" ${txQ.month === m ? 'selected' : ''}>${mlong(m)}</option>`).join('')}</select>
      <select id="txcat"><option value="">All categories</option>
        ${d.cats.map(c => `<option value="${esc(c)}" ${txQ.cat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select id="txkind">
        <option value="spend" ${txQ.kind === 'spend' ? 'selected' : ''}>Spending</option>
        <option value="" ${txQ.kind === '' ? 'selected' : ''}>Everything</option>
        <option value="income" ${txQ.kind === 'income' ? 'selected' : ''}>Income</option>
        <option value="internal" ${txQ.kind === 'internal' ? 'selected' : ''}>Internal moves</option>
      </select>
    </div>
    <p class="note">${plural(rows.length, 'payment')} · ${gbp(rows.reduce((s, r) => s - r.a, 0))}</p>
    ${rows.slice(0, txLimit).map(r => `
      <div class="row tap" data-teach="${esc(r.m)}">
        <div class="nm">${esc(r.m)}</div>
        <div class="qty">${gbp(-r.a, 2)}</div>
        <div class="meta">${dlabel(r.d)} · ${esc(catOf(r))}${r.o ? ' · one-off' : ''}</div>
        <div class="meta2">${esc(r.ac)}</div>
      </div>`).join('') || `<div class="empty">Nothing matches.</div>`}
    ${rows.length > txLimit ? `<div class="cta"><button class="btn sm" id="more-tx">Show 60 more</button></div>` : ''}
  </section>

  <section class="sec">
    <h2>Commitments running now</h2>
    ${M.commitments.live.map(c => `<div class="kv"><div class="k">${esc(c.name)}</div>
      <div class="v">${gbp(c.amount)}</div></div>`).join('')}
    ${M.commitments.ended.length ? `<p class="note">${plural(M.commitments.ended.length, 'commitment')}
      stopped: ${esc(M.commitments.ended.slice(0, 6).map(c => c.name).join(', '))}${M.commitments.ended.length > 6 ? '…' : ''}.
      Either they ended or they now come out of an account with no export.</p>` : ''}
  </section>

  <section class="sec">
    <h2>Pots and balances</h2>
    ${M.goal.pots.filter(p => p.known).map(p => `<div class="kv"><div class="k">${esc(p.name)}</div>
      <div class="v">${gbp(p.balance)}</div></div>`).join('')}
    <p class="note">Balances are typed into config.yaml on the laptop. Exports show flows, never balances.</p>
  </section>

  <section class="sec">
    <h2>This app</h2>
    <div class="kv"><div class="k">Built</div><div class="v">${esc(P.built)}</div></div>
    <div class="kv"><div class="k">Data to</div><div class="v">${esc(P.as_of)}</div></div>
    <div class="kv"><div class="k">Your edits</div><div class="v" id="syncline">${syncText()}</div></div>
    <div class="cta">
      ${P.sync ? `<button class="btn sm" id="syncnow">Save now</button>` : ''}
      <button class="btn sm" id="theme">Switch to ${themeNow() === 'dark' ? 'light' : 'dark'}</button>
      <button class="btn sm" id="lock">Lock</button>
    </div>
    ${P.sync ? `<p class="note">Categories and budgets you set here save themselves to
      <code>${esc(P.sync.repo)}</code>, a private repo. The next
      <code>app.py --deploy</code> folds them into <code>overrides.yaml</code>, so the
      laptop agrees with the phone without you copying anything.</p>` : ''}
  </section>`;
};

function filterTx() {
  const q = txQ.q.toLowerCase();
  return R.filter(r => {
    if (txQ.kind === 'spend' && r.k !== 'spend' && r.k !== 'refund') return false;
    if (txQ.kind && txQ.kind !== 'spend' && r.k !== txQ.kind) return false;
    if (txQ.month && r.d.slice(0, 7) !== txQ.month) return false;
    if (txQ.cat && catOf(r) !== txQ.cat) return false;
    if (q && !r.m.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : 0);
}

/* ── teach sheet ─────────────────────────────────────────────────── */

function teachSheet(merchant) {
  const d = derived();
  const mine = R.filter(r => r.m === merchant);
  const total = mine.filter(r => r.k === 'spend' || r.k === 'refund').reduce((s, r) => s - r.a, 0);
  const cur = catOf(mine[0]);
  sheet(esc(merchant),
    `${plural(mine.length, 'payment')} · ${gbp(total)} · currently ${esc(cur)}`,
    `<p class="note" style="margin-bottom:8px">Choosing a category moves every payment to this name, past and future.</p>
     <div class="chips">${d.cats.map(c => `<button class="chip" data-setcat="${esc(c)}"
        data-merchant="${esc(merchant)}" aria-pressed="${c === cur}">${esc(c)}</button>`).join('')}</div>
     <div class="field" style="margin-top:10px"><label>Or a new category</label>
       <input id="newcat" placeholder="Name it" autocomplete="off"
         data-merchant="${esc(merchant)}"></div>
     <div class="cta"><button class="btn sm" data-txfor="${esc(merchant)}">See all ${mine.length}</button></div>`);
}

/* ── render / routing ────────────────────────────────────────────── */

function render() {
  const host = $('#views');
  host.innerHTML = `<div class="view on">${V[tab]()}</div>`;
  $$('#tabs button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  if (tab === 'spend' || tab === 'month') {
    const s = $('#mstrip'); if (s) s.scrollLeft = s.scrollWidth;
    const g = $('#gridwrap'); if (g) g.scrollLeft = g.scrollWidth;
  }
  window.scrollTo(0, 0);
}
const go = t => { tab = t; render(); };

function themeNow() {
  if (L.theme) return L.theme;
  return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
function applyTheme() {
  if (L.theme) document.documentElement.setAttribute('data-theme', L.theme);
  else document.documentElement.removeAttribute('data-theme');
}

/* ── events ──────────────────────────────────────────────────────── */

function wire() {
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]'); if (b) go(b.dataset.tab);
  });
  $('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });

  document.addEventListener('click', e => {
    const t = e.target;

    const nav = t.closest('[data-go]');
    if (nav) { if (nav.dataset.ahead) spendMonth = M.budgets.ahead_month; return go(nav.dataset.go); }

    const mb = t.closest('#mstrip button');
    if (mb) { spendMonth = mb.dataset.month; return render(); }

    if (t.id === 'showgrid') { gridOpen = true; return render(); }
    if (t.id === 'more-tx') { txLimit += 60; return render(); }

    if (t.id === 'copyprev') {
      const prev = addMonths(spendMonth, -1), d = derived();
      L.budgets[spendMonth] = Object.assign({}, L.budgets[spendMonth]);
      derived().cats.forEach(c => {
        const v = budgetFor(prev, c).v; if (v) L.budgets[spendMonth][c] = v;
      });
      saveLocal(); return render();
    }

    const teach = t.closest('[data-teach]');
    if (teach) return teachSheet(teach.dataset.teach);

    const setcat = t.closest('.chip[data-setcat]');
    if (setcat) {
      L.cats[mkey(setcat.dataset.merchant)] = setcat.dataset.setcat;
      saveLocal(); bust(); closeSheet(); return render();
    }

    const txfor = t.closest('[data-txfor]');
    if (txfor) {
      const m = txfor.dataset.txfor;
      return txSheet(esc(m), 'every payment', R.filter(r => r.m === m)
        .sort((a, b) => a.d < b.d ? 1 : -1));
    }

    const cell = t.closest('[data-cat][data-month]');
    if (cell && !t.closest('input')) {
      const c = cell.dataset.cat, m = cell.dataset.month;
      return txSheet(esc(c), mlong(m), R.filter(r =>
        (r.k === 'spend' || r.k === 'refund') && !r.o &&
        r.d.slice(0, 7) === m && catOf(r) === c).sort((a, b) => a.d < b.d ? 1 : -1));
    }

    const oo = t.closest('[data-oneoff]');
    if (oo) {
      const m = oo.dataset.oneoff;
      return txSheet('One-offs', mlong(m), R.filter(r => r.o && r.d.slice(0, 7) === m));
    }

    // a tier on the Month tab opens its own categories
    const tier = t.closest('.bud[data-tier]');
    if (tier && !t.closest('input')) {
      spendTier = tier.dataset.tier; spendMonth = M.month.month; return go('spend');
    }
    const tf = t.closest('[data-tierfilter]');
    if (tf) { spendTier = tf.dataset.tierfilter; return render(); }

    const sm = t.closest('[data-savedmonth]');
    if (sm) {
      const mth = sm.dataset.savedmonth, pm = M.per_month[mth];
      return sheet(mlong(mth), `${gbp(pm.saved)} saved`,
        `<div class="kv"><div class="k">Came in</div><div class="v">${gbp(pm.income)}</div></div>
         <div class="kv"><div class="k">Went out</div><div class="v">${gbp(pm.spend)}</div></div>
         <div class="kv"><div class="k">of which fixed</div><div class="v">${gbp(pm.committed)}</div></div>
         <div class="kv"><div class="k">of which everything else</div><div class="v">${gbp(pm.variable)}</div></div>
         ${pm.one_off ? `<div class="kv"><div class="k">one-offs, held out</div><div class="v">${gbp(pm.one_off)}</div></div>` : ''}
         <div class="kv"><div class="k"><b>Left over</b></div><div class="v"><b>${gbp(pm.saved)}</b></div></div>
         <p class="note">Saving is what did not get spent, never a transfer that
           looked like saving. Moving money between your own pots changes nothing here.</p>`);
    }

    if (t.id === 'syncnow') return pushSync(true);
    if (t.id === 'theme') { L.theme = themeNow() === 'dark' ? 'light' : 'dark'; saveLocal(); applyTheme(); return render(); }
    if (t.id === 'lock') { localStorage.removeItem(LS + 'key'); return location.reload(); }
    if (t.id === 'forget') { L.cats = {}; saveLocal(); bust(); return render(); }
    if (t.id === 'export') {
      const y = 'category_by_merchant:\n' + Object.entries(L.cats)
        .map(([k, v]) => `  "${k}": ${v}`).join('\n') + '\n';
      navigator.clipboard?.writeText(y);
      sheet('Your edits', 'Paste into tools/money/overrides.yaml on the laptop',
        `<pre style="font-size:12px;white-space:pre-wrap;color:var(--dim)">${esc(y)}</pre>`);
    }
  });

  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'txmonth') { txQ.month = t.value; txLimit = 60; return render(); }
    if (t.id === 'txcat')   { txQ.cat = t.value; txLimit = 60; return render(); }
    if (t.id === 'txkind')  { txQ.kind = t.value; txLimit = 60; return render(); }
    // A tier figure is the sum of its categories, so setting it scales them all
    // by the same factor. One source of truth, and the shape you already spend
    // in is preserved.
    if (t.classList.contains('settier')) {
      const want = parseFloat(String(t.value).replace(/[^0-9.-]/g, ''));
      if (!isFinite(want) || want < 0) return render();
      const m = M.month.month, rows = tiers(m)[t.dataset.tier].rows;
      const now = rows.reduce((s, r) => s + r.b.v, 0);
      const b = (L.budgets[m] ||= {});
      if (!rows.length) return render();
      if (now > 0) rows.forEach(r => { b[r.c] = Math.round(r.b.v * (want / now)); });
      else rows.forEach(r => { b[r.c] = Math.round(want / rows.length); });
      // rounding leaves a pound or two adrift; give it to the biggest line so
      // the tier reads back exactly the figure that was typed
      const drift = want - rows.reduce((s, r) => s + b[r.c], 0);
      if (drift) b[rows[0].c] = Math.max(0, b[rows[0].c] + drift);
      saveLocal(); return render();
    }
    if (t.classList.contains('setb')) {
      const v = parseFloat(String(t.value).replace(/[^0-9.-]/g, ''));
      (L.budgets[spendMonth] ||= {})[t.dataset.setcat] = isFinite(v) ? v : 0;
      saveLocal(); return render();
    }
    if (t.id === 'newcat' && t.value.trim()) {
      L.cats[mkey(t.dataset.merchant)] = t.value.trim();
      saveLocal(); bust(); closeSheet(); return render();
    }
  });

  // the budget figure carries its £ at rest and drops it while you type in it
  document.addEventListener('focusin', e => {
    const t = e.target;
    if (t.classList?.contains('setb')) { t.value = t.dataset.raw; t.select(); }
  });
  document.addEventListener('focusout', e => {
    const t = e.target;
    if (t.classList?.contains('setb') && t.value === t.dataset.raw) t.value = gbp(+t.dataset.raw);
  });

  let typing;
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'txq') { txQ.q = t.value; txLimit = 60;
      clearTimeout(typing); typing = setTimeout(() => { render(); $('#txq')?.focus(); }, 220); }
  });
}

/* ── the vault ───────────────────────────────────────────────────── */

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pass) {
  const V = JSON.parse($('#vault').textContent);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
    'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name: 'PBKDF2', salt: b64(V.salt), iterations: V.iter, hash: 'SHA-256'},
    km, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(V.iv)}, key, b64(V.ct));
  let text;
  if (V.gzip) {
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([plain]).stream().pipeThrough(ds);
    text = await new Response(stream).text();
  } else {
    text = new TextDecoder().decode(plain);
  }
  return JSON.parse(text);
}

function boot(payload) {
  P = payload; M = P.metrics; R = P.rows; CG = P.groups || {};
  loadLocal(); applyTheme();
  $('#gate').remove();
  $('#shell').hidden = false;
  wire(); render();
  if (P.sync && localStorage.getItem(LS + 'dirty')) { sync.pending = true; pushSync(); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}

async function start() {
  const saved = localStorage.getItem(LS + 'key');
  if (saved) {
    try { return boot(await unlock(atob(saved))); }
    catch { localStorage.removeItem(LS + 'key'); }
  }
  const gate = $('#gate'), inp = $('#g-pass'), err = $('#g-err'), btn = $('#g-go');
  gate.hidden = false;
  const attempt = async () => {
    const p = inp.value; if (!p) return;
    btn.disabled = true; err.textContent = 'Unlocking…';
    try {
      const payload = await unlock(p);
      if ($('#g-remember').checked) localStorage.setItem(LS + 'key', btoa(p));
      boot(payload);
    } catch (e) {
      err.textContent = 'Not that one.'; btn.disabled = false; inp.select();
    }
  };
  btn.addEventListener('click', attempt);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
  setTimeout(() => inp.focus(), 60);
}

start();
})();
</script>
